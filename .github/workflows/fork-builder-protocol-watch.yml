name: Check protocol updates

on:
  workflow_dispatch:
  schedule:
    - cron: "8 */12 * * *"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest BedrockProtocol release
        uses: actions/github-script@v7
        with:
          script: |
            const latest = await github.rest.repos.getLatestRelease({
              owner: "pmmp",
              repo: "BedrockProtocol"
            }).catch(() => null);

            if (!latest) {
              core.warning("No upstream BedrockProtocol release was available.");
              return;
            }

            const marker = `<!-- pmfb-protocol:${latest.data.tag_name} -->`;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                labels: "protocol-update"
              }
            );

            if (issues.some(issue => issue.body?.includes(marker))) {
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Review BedrockProtocol ${latest.data.tag_name}`,
              labels: ["protocol-update"],
              body: [
                marker,
                "A protocol update was detected.",
                "",
                "Do not publish it as stable automatically.",
                "Review packet layouts, serializers, inventories, blocks and items, then test real player connections.",
                "",
                latest.data.html_url
              ].join("\n")
            });
