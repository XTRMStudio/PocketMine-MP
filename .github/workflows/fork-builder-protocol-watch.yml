name: Check Mojang Bedrock updates

on:
  workflow_dispatch:
  schedule:
    - cron: "8 */12 * * *"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-22.04

    steps:
      - name: Check official Mojang Bedrock samples
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: "Mojang",
                repo: "bedrock-samples",
                per_page: 100
              }
            );

            const newestPreview = releases.find(
              release => !release.draft && release.prerelease
            );

            const newestStable = releases.find(
              release => !release.draft && !release.prerelease
            );

            const selected = newestPreview || newestStable;

            if (!selected) {
              core.warning("No Mojang Bedrock sample release was found.");
              return;
            }

            const marker =
              "<!-- xtrm-bedrock-sample:" +
              selected.tag_name +
              " -->";

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all"
              }
            );

            if (issues.some(issue => issue.body?.includes(marker))) {
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Review Mojang Bedrock " + selected.tag_name,
              body: [
                marker,
                "A newer official Mojang Bedrock sample was detected.",
                "",
                "Sample: " + selected.html_url,
                "",
                "Use the PocketMine Fork Builder Auto update latest button.",
                "Do not change only the protocol number; packet/data changes must be implemented and tested."
              ].join("\n")
            });
