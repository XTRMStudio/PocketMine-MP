name: Import PMMP source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PMMP source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pmmp-source
          git clone --depth 1 "https://github.com/pmmp/PocketMine-MP.git" /tmp/pmmp-source

      - name: Import source without replacing repository history
        shell: bash
        run: |
          set -euo pipefail

          # Never copy the upstream Git metadata into the continuation repository.
          rm -rf /tmp/pmmp-source/.git

          # Keep Fork Builder workflows already installed in this repository.
          rm -rf /tmp/pmmp-source/.github/workflows

          # Remove old repository contents, but preserve this repository's .git folder
          # and its installed workflow files.
          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             -exec rm -rf {} +

          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1             ! -name "workflows"             -exec rm -rf {} +

          cp -a /tmp/pmmp-source/. .

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PocketMine Fork Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Repository source is already current."
            exit 0
          fi

          git commit -m "Import PMMP PocketMine-MP source"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
